[project]
name = "fine-memes"
version = "0.1.1"
description = ""
authors = [{ name = "Angel L. P.", email = "59593766+angelphanth@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pillow (>=12.3.0,<13.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ipython (>=9.17.1,<10.0.0)",
]

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff"
,
]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["fine_memes"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
